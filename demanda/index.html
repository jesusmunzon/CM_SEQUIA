<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   Demanda - Control hídrico
  </title>
  <link href="../css/menu-encabezado.css" rel="stylesheet"/>
  <link href="../css/demanda.css" rel="stylesheet"/>
 </head>
 <body>
  <aside class="sidebar">
    <div class="brand">
      <img class="brand-logo" src="../ICONOS/logo.svg" alt="EMASESA">
      <div><b>CONTROL HÍDRICO</b><small>Panel de explotación</small></div>
    </div>
   <nav class="menu">
    <a class="nav-btn" href="../">
     <span class="menu-icon">
      <svg aria-hidden="true" viewbox="0 0 24 24">
       <path d="M12 3C9.8 6.5 6 10.2 6 14a6 6 0 0 0 12 0c0-3.8-3.8-7.5-6-11Z">
       </path>
      </svg>
     </span>
     <em>
      Embalses
     </em>
    </a>
    <a class="nav-btn" href="../explotacion/">
     <span class="menu-icon">
      <svg aria-hidden="true" viewbox="0 0 24 24">
       <path d="M3 12h4l2-5 4 11 2.5-6H21">
       </path>
      </svg>
     </span>
     <em>
      Explotación
     </em>
    </a>
    <a class="nav-btn" href="../actuaciones/">
     <span class="menu-icon">
      <svg aria-hidden="true" viewbox="0 0 24 24">
       <path d="M5 4h11a2 2 0 0 1 2 2v13H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z">
       </path>
       <path d="m7 11 3 3 7-8">
       </path>
      </svg>
     </span>
     <em>
      Actuaciones
     </em>
    </a>
    <a class="nav-btn active" href="../demanda/">
     <span class="menu-icon">
      <svg aria-hidden="true" viewbox="0 0 24 24">
       <path d="M5 20V11M10 20V4M15 20v-7M20 20V7">
       </path>
      </svg>
     </span>
     <em>
      Demanda
     </em>
    </a>
   </nav>
   <button class="print-btn" id="printBtn" onclick="window.print()" type="button">
    <span>
     ⎙
    </span>
    <em>
     Imprimir
    </em>
   </button>
   <div class="side-foot">
    DATOS DE DEMOSTRACIÓN
   </div>
  </aside>
  <div class="main">
   <header class="topbar">
    <h1 id="pageTitle">DEMANDA</h1>
    <label id="dateFilter">Fecha de consulta
     <input id="fecha" type="date" min="2023-10-01" max="2023-11-30" value="2023-11-07">
    </label>
   </header>
   <main class="demanda-page">
    <div class="demanda-grid">

     <!-- DEMANDA AGUA POTABLE -->
     <section aria-labelledby="demandaTitle" class="dm-card dm-demanda">
      <header class="dm-heading dm-heading-grey">
       <h2 id="demandaTitle">DEMANDA AGUA POTABLE</h2>
      </header>
      <div class="dm-stage-wrap" id="dmStageWrap">
       <div class="dm-stage" id="dmStage"></div>
      </div>
     </section>

     <!-- COSTES SEQUÍA -->
     <section aria-labelledby="costesTitle" class="dm-card dm-costes">
      <header class="dm-heading dm-heading-yellow">
       <h2 id="costesTitle">COSTES SEQUÍA</h2>
      </header>
      <div class="dm-costes-body">
       <div class="dm-costes-table" id="dmCostes"></div>
       <p class="dm-costes-note" id="dmCostesNota"></p>
      </div>
     </section>

     <!-- ACCIONES -->
     <section aria-labelledby="accionesTitle" class="dm-card dm-acciones">
      <header class="dm-heading dm-heading-purple">
       <h2 id="accionesTitle">ACCIONES</h2>
       <button class="dm-add" id="dmAdd" type="button">＋ Añadir acción</button>
      </header>
      <div class="dm-acciones-body">
       <div class="dm-weeks-panel">
        <div class="dm-weeks-tools">
         <label>Año <select id="dmAnio"></select></label>
         <label>Desde <select id="dmMes"></select></label>
         <span class="dm-legend"><i class="l1"></i>Normal <i class="l2"></i>Alta <i class="l3"></i>Crítica</span>
        </div>
        <div class="dm-months" id="dmMonths"></div>
       </div>
       <div class="dm-agenda-wrap">
        <div class="dm-notebook" id="dmNotebook">
         <img alt="" class="dm-nb-bg" src="../ICONOS/Agenda_Demanda.svg"/>
         <div class="dm-page dm-page-left">
          <div class="dm-cols"><span>INICIO</span><span>FIN</span><span>ACCIÓN</span><span>IMPACTO</span></div>
          <div class="dm-rows" id="dmRowsL"></div>
         </div>
         <div class="dm-page dm-page-right">
          <div class="dm-notes">
           <span class="dm-note n22"><img alt="" src="../ICONOS/Nota_Demanda.svg"/><b>2022</b></span>
           <span class="dm-note n23"><img alt="" src="../ICONOS/Nota_Demanda.svg"/><b>2023</b></span>
           <img alt="Objetivo 90" class="dm-obj90" src="../ICONOS/Objetivo90_Demanda.svg"/>
          </div>
          <div class="dm-rows" id="dmRowsR"></div>
         </div>
        </div>
       </div>
      </div>
     </section>

    </div>
   </main>
  </div>

  <dialog id="dmDialog">
   <form id="dmForm" method="dialog">
    <h3 id="dmDialogTitle">Acción formativa</h3>
    <label>Acción <input id="fAccion" required type="text"/></label>
    <div class="dm-form-row">
     <label>Inicio <input id="fInicio" type="date"/></label>
     <label>Fin <input id="fFin" type="date"/></label>
    </div>
    <div class="dm-form-row">
     <label>Importe <input id="fImporte" step="any" type="number"/></label>
     <label>Unidad
      <select id="fUnidad">
       <option value="millones">millones</option>
       <option value="miles">miles</option>
       <option value="personas">personas</option>
       <option value="€">€</option>
       <option value="">(sin unidad)</option>
      </select>
     </label>
    </div>
    <div class="dm-form-actions">
     <button class="del" id="fEliminar" type="button">Eliminar</button>
     <span></span>
     <button id="fCancelar" type="button">Cancelar</button>
     <button class="ok" type="submit">Guardar</button>
    </div>
   </form>
  </dialog>

  <script src="../data/demanda-data.js"></script>
  <script src="../data/iconos-inline.js"></script>
  <script src="../js/demanda.js"></script>
  <script src="../js/impresion.js"></script>
 </body>
</html>
